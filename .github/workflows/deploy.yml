name: Atlash AI Agent CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRALAI_API_KEY: ${{ secrets.MISTRALAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
        run: |
          python testing/test_pipeline.py


  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_PROD }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT,YDC_API_KEY
          script: |
            echo "Starting deployment on AWS Server..."
            cd ~/AtlashAi-agent || cd /home/ubuntu/AtlashAi-agent || cd /var/www/AtlashAi-agent
            git fetch origin main
            git reset --hard origin/main
            
            # --- Auto-sync Environment Variables (Zero-Touch) ---
            # 1. If full ENV_PROD is provided in GitHub Secrets, write complete .env
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > .env
              chmod 600 .env
              echo " .env updated automatically from ENV_PROD!"
            # 2. Or if YDC_API_KEY is provided individually, ensure it exists in .env
            elif [ -n "$YDC_API_KEY" ] && [ -f ".env" ]; then
              if grep -q "^YDC_API_KEY=" .env; then
                sed -i "s|^YDC_API_KEY=.*|YDC_API_KEY=$YDC_API_KEY|" .env
              else
                echo "YDC_API_KEY=$YDC_API_KEY" >> .env
              fi
              echo " YDC_API_KEY synced into .env automatically!"
            fi

            # Clean all quotes from .env so Docker --env-file doesn't pass literal quotes
            if [ -f ".env" ]; then
              sed -i -E 's/^([A-Za-z0-9_]+)=["'"'"'](.*)["'"'"']$/\1=\2/' .env
            fi

            # Restart service or docker container
            if [ -f "docker-compose.yml" ]; then
              docker compose down
              docker compose up -d --build
            elif command -v docker &> /dev/null && [ -f "Dockerfile" ]; then
              docker build -t atlash-agent .
              docker stop atlash-agent-app atlash-agent-container || true
              docker rm atlash-agent-app atlash-agent-container || true
              docker run -d --name atlash-agent-app -p 8000:8000 --env-file .env --restart always atlash-agent
            else
              sudo systemctl restart atlash-agent || pm2 restart atlash-agent || true
            fi
            echo " Deployment completed successfully!"
