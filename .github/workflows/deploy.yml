name: Atlash AI Agent CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRALAI_API_KEY: ${{ secrets.MISTRALAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python testing/test_pipeline.py


  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment on AWS Server..."
            cd ~/AtlashAi-agent || cd /home/ubuntu/AtlashAi-agent || cd /var/www/AtlashAi-agent
            git fetch origin main
            git reset --hard origin/main
            
            # Restart service or docker container
            if [ -f "docker-compose.yml" ]; then
              docker compose down
              docker compose up -d --build
            elif command -v docker &> /dev/null && [ -f "Dockerfile" ]; then
              docker build -t atlash-agent .
              docker stop atlash-agent-container || true
              docker rm atlash-agent-container || true
              docker run -d --name atlash-agent-container -p 8000:8000 --env-file .env --restart always atlash-agent
            else
              sudo systemctl restart atlash-agent || pm2 restart atlash-agent || true
            fi
            echo "Deployment completed successfully!"
